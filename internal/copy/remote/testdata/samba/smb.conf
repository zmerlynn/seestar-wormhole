[global]
server role = standalone server
security = user
map to guest = Bad User
guest account = nobody
server min protocol = SMB2_10
server max protocol = SMB3_11
disable netbios = yes
load printers = no
printing = bsd
printcap name = /dev/null
disable spoolss = yes
log level = 1

[EMMC Images]
path = /srv/emmc
guest ok = yes
guest only = yes
read only = yes

[scratch]
path = /srv/scratch
guest ok = yes
guest only = yes
read only = no
