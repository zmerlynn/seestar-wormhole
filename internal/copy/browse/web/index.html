<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse telescope files</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header>
<h1>Browse telescope files</h1>
<span id="endpoint"></span>
<span class="note">Read-only view of the telescope's share</span>
</header>
<nav id="crumbs" aria-label="Folder"></nav>
<p id="status" role="status">Loading…</p>
<div class="scroll">
<table id="list" hidden>
<thead><tr><th><span class="hide">Preview</span></th><th>Name</th><th class="num">Size</th><th>Modified</th><th class="st">Status</th><th><span class="hide">Save</span></th></tr></thead>
<tbody></tbody>
</table>
</div>
<div id="key" hidden>
<h2>Key</h2>
<ul class="note" role="list" aria-label="Status key">
<li><span class="badge new">new</span><span class="hide">:</span> not copied yet</li>
<li><span class="badge copied">copied</span><span class="hide">:</span> already copied</li>
<li><span class="badge changed">changed</span><span class="hide">:</span> differs from the copy</li>
<li><span class="badge left-out">left out</span><span class="hide">:</span> not copied by the selection</li>
</ul>
</div>
<dialog id="viewer" aria-labelledby="vname">
<div id="vbody">
<img alt="">
<pre id="vtext" hidden></pre>
<p id="vnote" role="status"></p>
<p><span id="vname"></span> <a id="vsave" class="btn" download>Save</a> <button id="vclose" class="btn" type="button">Close</button></p>
</div>
</dialog>
</body>
</html>
