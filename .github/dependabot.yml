# Version updates for the SHA-pinned workflow actions and the Containerfile's
# digest-pinned build image, whose CA bundle ships in the image. Go modules get
# security updates alone.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
