name: GUI spike

# Builds the gui-tagged window on each desktop platform, launches it with no
# configuration, captures a screenshot, then quits and checks the exit.

on:
  push:
    branches: [lane/wails-spike]

permissions:
  contents: read

env:
  GOFLAGS: -mod=vendor
  GOTOOLCHAIN: local
  GOPROXY: 'off'
  GOSUMDB: 'off'

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build app bundles
        run: bash scripts/build-gui-mac.sh "$RUNNER_TEMP/out"
      - name: Launch, screenshot, quit
        run: |
          mkdir -p shots
          app="$RUNNER_TEMP/out/arm64/seestar-wormhole.app"
          open --stdout "$PWD/shots/macos.log" --stderr "$PWD/shots/macos.log" "$app"
          sleep 20
          screencapture -x shots/macos.png
          pgrep -x seestar-wormhole
          osascript -e 'tell application id "net.zml.seestar-wormhole" to quit' || echo "quit event failed: $?"
          for _ in $(seq 30); do pgrep -x seestar-wormhole >/dev/null || break; sleep 1; done
          if pgrep -x seestar-wormhole; then echo "still running after quit"; exit 1; fi
          echo "exited after quit"
      - name: Package bundles
        if: always()
        run: |
          cd "$RUNNER_TEMP/out"
          ditto -c -k --keepParent arm64/seestar-wormhole.app "$GITHUB_WORKSPACE/shots/seestar-wormhole-macos-arm64.zip"
          ditto -c -k --keepParent amd64/seestar-wormhole.app "$GITHUB_WORKSPACE/shots/seestar-wormhole-macos-amd64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos
          path: shots/
          retention-days: 7

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p shots
          for arch in amd64 arm64; do
            GOARCH=$arch go build -tags gui,production -trimpath -buildvcs=false \
              -ldflags='-s -w -H windowsgui' -o shots/seestar-wormhole-windows-$arch.exe ./cmd/seestar-wormhole
          done
      - name: Launch, screenshot, close the window
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $p = Start-Process -FilePath shots\seestar-wormhole-windows-amd64.exe -PassThru
          Start-Sleep -Seconds 20
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("shots\windows.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $p.Refresh()
          "main window title: '$($p.MainWindowTitle)'"
          if ($p.HasExited) { "exited early with $($p.ExitCode)"; exit 1 }
          if (-not $p.CloseMainWindow()) { "no main window to close"; Stop-Process -Id $p.Id; exit 1 }
          if (-not $p.WaitForExit(30000)) { "still running after close"; Stop-Process -Id $p.Id; exit 1 }
          "exited after close with $($p.ExitCode)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows
          path: shots/
          retention-days: 7

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install GTK4 and WebKitGTK 6.0
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev xvfb x11-apps imagemagick
      - name: Build
        env:
          CGO_ENABLED: '1'
        run: |
          mkdir -p shots
          go build -tags gui,production -trimpath -buildvcs=false -ldflags='-s -w' \
            -o shots/seestar-wormhole-linux-amd64 ./cmd/seestar-wormhole
      - name: Launch, screenshot, terminate
        run: |
          cat > "$RUNNER_TEMP/shot.sh" <<'EOF'
          set -u
          GDK_BACKEND=x11 shots/seestar-wormhole-linux-amd64 > shots/linux.log 2>&1 &
          pid=$!
          sleep 20
          import -window root shots/linux.png
          kill -0 "$pid" || { echo "exited early"; wait "$pid"; exit 1; }
          kill -TERM "$pid"
          wait "$pid"; echo "exited after SIGTERM with $?"
          EOF
          xvfb-run -a -s '-screen 0 1280x800x24' bash "$RUNNER_TEMP/shot.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux
          path: shots/
          retention-days: 7
