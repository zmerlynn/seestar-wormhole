name: Release

on:
  push:
    tags: ['v*'] # release.sh enforces the full version grammar before building.
  workflow_dispatch:
    inputs:
      version:
        description: Version for artifact-only rehearsal (no release is created)
        required: true
        default: v0.5.0-rc.0
        type: string

permissions:
  contents: read

env:
  GOFLAGS: -mod=vendor -p=2
  GOMAXPROCS: '2'
  GOTOOLCHAIN: local
  GOPROXY: 'off'
  GOSUMDB: 'off'

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  validate:
    runs-on: ubuntu-24.04
    container: golang:1.27.3
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release version
        id: version
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          ./scripts/release.sh --validate-only "$RELEASE_VERSION"
          printf 'version=%s\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  portable:
    needs: [validate, verify]
    runs-on: ubuntu-24.04
    container: golang:1.27.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build six CLI and two Windows UI executables
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/release.sh "$RELEASE_VERSION"
          # Windows Authenticode signing would go here.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-part-portable
          path: dist/parts/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  linux-ui:
    needs: [validate, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Build Linux UI
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '1'
          GOAMD64: v1
          GOARM64: v8.0
        run: |
          revision=$(git rev-parse --short=12 HEAD)
          mkdir -p dist
          go build -tags gui,production -trimpath -buildvcs=false \
            -ldflags="-s -w -X main.version=$RELEASE_VERSION -X main.revision=$revision" \
            -o "dist/seestar-wormhole_${RELEASE_VERSION}_linux_${GOARCH}" ./cmd/seestar-wormhole
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-part-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  macos-ui:
    needs: [validate, verify, portable]
    runs-on: macos-26
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-part-portable
          path: ${{ runner.temp }}/mac-ui/cli
      - name: Install DMG build dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/dmg-venv"
          source "$RUNNER_TEMP/dmg-venv/bin/activate"
          python3 -m pip install --require-hashes --only-binary :all: -r scripts/dmg-requirements.txt
          echo "$RUNNER_TEMP/dmg-venv/bin" >> "$GITHUB_PATH"
      - name: Build universal Mac UI, sign and package DMG
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          MACOS_KEYCHAIN_PATH: ${{ runner.temp }}/wormhole-signing.keychain-db
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: ./scripts/build-gui-mac.sh "$RUNNER_TEMP/mac-ui" "$RELEASE_VERSION" "$(git rev-parse --short=12 HEAD)"
      - name: Delete temporary signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/wormhole-signing.keychain-db"
          if [[ -e "$keychain" ]]; then security delete-keychain "$keychain"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-part-macos
          path: ${{ runner.temp }}/mac-ui/*.dmg
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  release:
    needs: [validate, verify, portable, linux-ui, macos-ui]
    runs-on: ubuntu-24.04
    container: golang:1.27.3
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-part-*
          path: dist/parts
          merge-multiple: true
      - name: Assemble archives, verify complete inventory and write checksums
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/release.sh --checksums "$RELEASE_VERSION"
          cd dist
          sha256sum --check SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ needs.validate.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Create draft release and upload archives, DMG and checksums
        if: github.event_name == 'push'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const files = fs.readdirSync('dist').sort();
            if (files.length !== 6 || !files.includes('SHA256SUMS')) {
              throw new Error('Expected five downloads and SHA256SUMS');
            }
            const { data: release } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: context.ref.slice('refs/tags/'.length),
              name: context.ref.slice('refs/tags/'.length),
              draft: true,
              prerelease: /-rc\.[0-9]+$/.test(context.ref),
              generate_release_notes: true
            });
            for (const name of files) {
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo,
                release_id: release.id,
                name,
                data: fs.readFileSync(path.join('dist', name)),
                headers: { 'content-type': name === 'SHA256SUMS' ? 'text/plain' : 'application/octet-stream' }
              });
            }
