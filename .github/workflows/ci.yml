name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  GOFLAGS: -mod=vendor
  GOTOOLCHAIN: local
  GOPROXY: 'off'
  GOSUMDB: 'off'

jobs:
  go-support:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test Go support check
        run: ./scripts/test-go-support.sh
      - name: Check Go support
        run: ./scripts/check-go-support.sh

  verify:
    runs-on: ubuntu-24.04
    container: golang:1.27.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check formatting
        run: |
          unformatted=$(find . \( -type d -name '.*' ! -name . -o -path ./vendor \) -prune -o -type f -name '*.go' -print | xargs gofmt -l)
          if [ -n "$unformatted" ]; then
            printf 'gofmt needed:\n%s\n' "$unformatted" >&2
            exit 1
          fi
      - name: Build, vet and test vendored source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          go run ./scripts/generate-licenses.go --check
          go run ./scripts/checklicenses
          go build ./...
          go vet ./...
          go test -race -count=2 -timeout 20m ./...
          go test scripts/release.go scripts/release_test.go
          ./scripts/test-check.sh
          # The copy packages on every release target; the Samba tests only build here.
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build -p 2 ./cmd/seestar-copy-cli ./internal/copy/...
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go vet -p 2 ./cmd/seestar-copy-cli ./internal/copy/...
          done
          go vet -p 2 -tags smbintegration ./internal/copy/remote ./internal/copy/app

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build vendored source
        run: go build ./...
      - name: Vet vendored source
        run: go vet ./...
      - name: Test vendored source
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            go test -race ./...
          else
            go test -v ./...
          fi
      - name: Page tests in JavaScriptCore
        # The page regressions skip without jsc, which only macOS ships.
        if: runner.os == 'macOS'
        run: |
          jsc=/System/Library/Frameworks/JavaScriptCore.framework/Versions/Current/Helpers/jsc
          if [[ ! -x "$jsc" ]]; then
            echo "::error::JavaScriptCore shell missing at $jsc"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/jsc"
          ln -sf "$jsc" "$RUNNER_TEMP/jsc/jsc"
          PATH="$RUNNER_TEMP/jsc:$PATH" go test -count=1 -v ./internal/ui | tee "$RUNNER_TEMP/page-tests.log"
          if grep -q 'JavaScriptCore shell is not installed' "$RUNNER_TEMP/page-tests.log"; then
            echo "::error::a page test skipped"
            exit 1
          fi
          grep -q 'PASS: TestCopySetupPage' "$RUNNER_TEMP/page-tests.log"
      - name: Test release tooling
        run: go test scripts/release.go scripts/release_test.go
      - name: Build and smoke test native binary
        run: |
          binary=seestar-wormhole
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            binary+=.exe
          fi
          go build -o "$binary" ./cmd/seestar-wormhole
          "./$binary" --version
          "./$binary" proxy --help
      - name: Build and smoke test native seestar-copy-cli
        run: |
          binary=seestar-copy-cli
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            binary+=.exe
          fi
          go build -o "$binary" ./cmd/seestar-copy-cli
          "./$binary" --version
          "./$binary" sync --help

  copy-smb:
    # seestar-copy's Samba tests against the fixture share.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Start the Samba fixture
        run: |
          docker build -f internal/copy/remote/testdata/samba/Containerfile -t seestar-copy-samba internal/copy/remote/testdata/samba
          docker run -d --name samba -p 127.0.0.1:14450:14450 seestar-copy-samba
          for try in $(seq 50); do
            if docker exec samba bash -c 'exec 3<>/dev/tcp/127.0.0.1/14450'; then exit 0; fi
            sleep 0.2
          done
          docker logs samba
          exit 1
      - name: SMB integration tests
        env:
          SEESTAR_COPY_SMB_ENDPOINT: 127.0.0.1:14450
        run: go test -tags smbintegration -race -count=1 -timeout 10m -v ./internal/copy/remote ./internal/copy/app
      - name: Samba log
        if: failure()
        run: docker logs samba


  copy-browser:
    # Playwright tests of seestar-copy-cli browse's page and the app's page,
    # which internal/ui's TestBrowserServer serves without a window.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Start the Samba fixture with the browse tree
        run: |
          docker build --target browse -f internal/copy/remote/testdata/samba/Containerfile -t seestar-copy-samba-browse internal/copy/remote/testdata/samba
          docker run -d --name samba -p 127.0.0.1:14450:14450 seestar-copy-samba-browse
          for try in $(seq 50); do
            if docker exec samba bash -c 'exec 3<>/dev/tcp/127.0.0.1/14450'; then exit 0; fi
            sleep 0.2
          done
          docker logs samba
          exit 1
      - name: Start browse
        run: |
          go build -o "$RUNNER_TEMP/seestar-copy-cli" ./cmd/seestar-copy-cli
          echo "CLI_BIN=$RUNNER_TEMP/seestar-copy-cli" >> "$GITHUB_ENV"
          go test -c -o "$RUNNER_TEMP/ui.test" ./internal/ui
          echo "UI_TEST_BIN=$RUNNER_TEMP/ui.test" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/seestar-copy-cli" browse --endpoint 127.0.0.1:14450 --listen 127.0.0.1:0 \
            > "$RUNNER_TEMP/browse.url" 2> "$RUNNER_TEMP/browse.log" &
          for try in $(seq 50); do
            if [ -s "$RUNNER_TEMP/browse.url" ]; then
              echo "BROWSE_URL=$(head -n 1 "$RUNNER_TEMP/browse.url")" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/browse.log"
          exit 1
      - name: Install Playwright and its browsers
        working-directory: test/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Browser tests
        working-directory: test/browser
        run: npx playwright test
      - name: Upload screenshots
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: copy-browser-screenshots
          path: test/browser/screenshots
          if-no-files-found: ignore
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: copy-playwright-report
          path: |
            test/browser/playwright-report
            test/browser/test-results
          if-no-files-found: ignore
      - name: browse and Samba logs
        if: failure()
        run: |
          cat "$RUNNER_TEMP/browse.log" || true
          docker logs samba

  vendor:
    runs-on: ubuntu-24.04
    container: golang:1.27.3
    env:
      GOFLAGS: ''
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Vendor tree is reproducible
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          go mod tidy
          go mod vendor
          test -z "$(git status --porcelain -- go.mod go.sum vendor)" || { git status --porcelain -- go.mod go.sum vendor; exit 1; }
