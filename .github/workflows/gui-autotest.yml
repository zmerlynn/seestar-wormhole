name: GUI autotest

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'scripts/gui-autotest/**'
      - 'scripts/gui-mac-clang.sh'
      - 'scripts/build-gui-mac.sh'
      - 'vendor/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/gui-autotest.yml'
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'scripts/gui-autotest/**'
      - 'scripts/gui-mac-clang.sh'
      - 'scripts/build-gui-mac.sh'
      - 'vendor/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/gui-autotest.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GOFLAGS: -mod=vendor -p=2
  GOMAXPROCS: '2'
  GOTOOLCHAIN: local
  GOPROXY: 'off'
  GOSUMDB: 'off'

jobs:
  native:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025, ubuntu-24.04]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev bubblewrap xvfb xauth imagemagick dbus-x11 openbox
      - name: Build fixture and prove build isolation
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gui-shots"
          ext=''; flags=''
          if [[ "$RUNNER_OS" == Windows ]]; then
            export CGO_ENABLED=0
            ext=.exe; flags='-H windowsgui'
          else
            export CGO_ENABLED=1
            if [[ "$RUNNER_OS" == macOS ]]; then
              export CC="$PWD/scripts/gui-mac-clang.sh" MACOSX_DEPLOYMENT_TARGET=13.0
            fi
          fi
          # Keep symbols: scan the actual executables, with a positive control.
          for variant in fixture production plain; do
            case "$variant" in
              fixture) tags=gui,guitest,production ;;
              production) tags=gui,production ;;
              plain) tags=gui ;;
            esac
            go build -tags "$tags" -trimpath -buildvcs=false -ldflags="$flags" \
              -o "$RUNNER_TEMP/gui-$variant$ext" ./cmd/seestar-wormhole
          done
          go build -tags guitest -o "$RUNNER_TEMP/gui-harness$ext" ./scripts/gui-autotest
          "$RUNNER_TEMP/gui-harness$ext" -verify "$RUNNER_TEMP/gui-fixture$ext,$RUNNER_TEMP/gui-production$ext,$RUNNER_TEMP/gui-plain$ext" \
            | tee "$RUNNER_TEMP/gui-shots/build-isolation.log"
          go test -tags gui,guitest,production ./internal/ui ./internal/guitest ./scripts/gui-autotest \
            | tee "$RUNNER_TEMP/gui-shots/tagged-tests.log"
      - name: Test Windows UI console cancellation and redirections
        if: runner.os == 'Windows'
        run: go test -v -tags gui,production ./cmd/seestar-wormhole -run '^TestConsole' -timeout 3m
      - name: Prepare Mac fixture bundle
        if: runner.os == 'macOS'
        run: |
          app="$RUNNER_TEMP/GUIFixture.app/Contents"
          mkdir -p "$app/MacOS"
          cp "$RUNNER_TEMP/gui-fixture" "$app/MacOS/seestar-wormhole"
          # Reuse the Mac build's bundle metadata, including the Apple-event ID.
          sed -n '/^<?xml/,/^PLIST/p' scripts/build-gui-mac.sh | sed '$d' > "$app/Info.plist"
          plutil -replace CFBundleVersion -string 1 "$app/Info.plist"
          plutil -replace CFBundleShortVersionString -string 0.0.0 "$app/Info.plist"
          plutil -lint "$app/Info.plist"
          test "$(plutil -extract CFBundleVersion raw -o - "$app/Info.plist")" = 1
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$app/Info.plist")" = 0.0.0
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$RUNNER_TEMP/GUIFixture.app"
      - name: Windows network guard
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Loopback is exempt from Windows Firewall filtering. Block external
          # traffic from the fixture and the engine, including background work.
          New-NetFirewallRule -DisplayName GUIAutotestFixture -Direction Outbound -Action Block -Program "$env:RUNNER_TEMP\gui-fixture.exe"
          Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application" -Filter msedgewebview2.exe -Recurse | ForEach-Object {
            New-NetFirewallRule -DisplayName GUIAutotestEngine -Direction Outbound -Action Block -Program $_.FullName
          }
      - name: Windows light and dark scenarios
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $theme='HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          New-Item -Path $theme -Force | Out-Null
          Set-ItemProperty $theme AppsUseLightTheme 1
          & "$env:RUNNER_TEMP\gui-harness.exe" -binary "$env:RUNNER_TEMP\gui-fixture.exe" -out "$env:RUNNER_TEMP\gui-shots\light" 2>&1 | Tee-Object "$env:RUNNER_TEMP\gui-shots\light.log"
          $light=$LASTEXITCODE
          Set-ItemProperty $theme AppsUseLightTheme 0
          & "$env:RUNNER_TEMP\gui-harness.exe" -binary "$env:RUNNER_TEMP\gui-fixture.exe" -out "$env:RUNNER_TEMP\gui-shots\dark" -scenarios dark,dark-telescope-picker 2>&1 | Tee-Object "$env:RUNNER_TEMP\gui-shots\dark.log"
          if ($light -ne 0 -or $LASTEXITCODE -ne 0) { exit 1 }
      - name: Mac light and dark scenarios
        if: runner.os == 'macOS'
        run: |
          set -uo pipefail
          # sandbox-exec also confines Apple-event senders, even with allow
          # default. Keep osascript in the harness outside that sandbox, while
          # the fixture and engine retain the outbound network restriction.
          binary="$RUNNER_TEMP/gui-fixture-sandbox"
          cat > "$binary" <<'SCRIPT'
          #!/bin/bash
          profile='(version 1)(allow default)(deny network-outbound (remote ip "*:*"))(allow network-outbound (remote ip "localhost:*"))'
          exec sandbox-exec -p "$profile" "$RUNNER_TEMP/GUIFixture.app/Contents/MacOS/seestar-wormhole" "$@"
          SCRIPT
          chmod +x "$binary"
          defaults delete -g AppleInterfaceStyle 2>/dev/null || true
          "$RUNNER_TEMP/gui-harness" -binary "$binary" \
            -out "$RUNNER_TEMP/gui-shots/light" -scenarios fresh,quit-connecting,quit-ready,close-connecting,close-ready,activate,strand,errors,term,interrupt,apple,computer,incompatible,http-permission,http-conflict,bind-error,discovery-error,saved-password,save-denied,save-timeout,remove-denied,remove-timeout,settings-failure,release-uncertain,browser-copy,details,lost-controls,telescope-picker \
            2>&1 | tee "$RUNNER_TEMP/gui-shots/light.log"
          light=${PIPESTATUS[0]}
          defaults write -g AppleInterfaceStyle Dark
          "$RUNNER_TEMP/gui-harness" -binary "$binary" \
            -out "$RUNNER_TEMP/gui-shots/dark" -scenarios dark,dark-telescope-picker 2>&1 | tee "$RUNNER_TEMP/gui-shots/dark.log"
          dark=${PIPESTATUS[0]}
          test "$light" = 0 && test "$dark" = 0
      - name: Linux sandbox probe and light and dark scenarios
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # Use a private network namespace with loopback only. Xvfb and D-Bus
          # use Unix sockets; neither the fixture nor WebKit can reach a service.
          cat > "$RUNNER_TEMP/gui-linux.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          ip link set lo up
          exec runuser -u "$1" -- env RUNNER_TEMP="$2" PATH="$3" \
            GDK_BACKEND=x11 GTK_A11Y=none \
            dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' bash "$2/gui-linux-session.sh"
          SCRIPT
          cat > "$RUNNER_TEMP/gui-linux-session.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -uo pipefail
          openbox > "$RUNNER_TEMP/gui-shots/window-manager.log" 2>&1 &
          wm=$!
          trap 'kill "$wm" 2>/dev/null || true' EXIT
          mode=${1:-light}
          if [[ "$mode" == probe ]]; then
            "$RUNNER_TEMP/gui-harness" -binary "$RUNNER_TEMP/gui-fixture" \
              -out "$RUNNER_TEMP/gui-shots/bubblewrap-probe" -scenarios relaunch -timeout 35s
            exit $?
          fi
          export GTK_THEME=Adwaita
          gsettings set org.gnome.desktop.interface color-scheme prefer-light
          "$RUNNER_TEMP/gui-harness" -binary "$RUNNER_TEMP/gui-fixture" \
            -out "$RUNNER_TEMP/gui-shots/light" 2>&1 | tee "$RUNNER_TEMP/gui-shots/light.log"
          light=${PIPESTATUS[0]}
          export GTK_THEME=Adwaita:dark
          gsettings set org.gnome.desktop.interface color-scheme prefer-dark
          "$RUNNER_TEMP/gui-harness" -binary "$RUNNER_TEMP/gui-fixture" \
            -out "$RUNNER_TEMP/gui-shots/dark" -scenarios dark,dark-telescope-picker 2>&1 | tee "$RUNNER_TEMP/gui-shots/dark.log"
          dark=${PIPESTATUS[0]}
          test "$light" = 0 && test "$dark" = 0
          SCRIPT
          # Record the distro package/profile and explicitly test the restricted
          # setting first. Probe failure is evidence, not a waiver for the suite.
          dpkg-query -W bubblewrap libwebkitgtk-6.0-4 | tee "$RUNNER_TEMP/gui-shots/bubblewrap-package.log"
          dpkg -L bubblewrap | tee -a "$RUNNER_TEMP/gui-shots/bubblewrap-package.log"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          # The same namespace/display path, with only the short probe selected.
          sed 's@bash "$2/gui-linux-session.sh"@bash "$2/gui-linux-session.sh" probe@' "$RUNNER_TEMP/gui-linux.sh" > "$RUNNER_TEMP/gui-probe.sh"
          if sudo unshare --net bash "$RUNNER_TEMP/gui-probe.sh" "$USER" "$RUNNER_TEMP" "$PATH" \
            > "$RUNNER_TEMP/gui-shots/bubblewrap-probe.log" 2>&1; then
            echo 'PROBE bubblewrap WITHOUT userns relaxation PASS' | tee -a "$RUNNER_TEMP/gui-shots/bubblewrap-probe.log"
          else
            log="$RUNNER_TEMP/gui-shots/bubblewrap-probe/relaunch/process.log"
            grep -F 'WebKit sandbox unavailable. Install bubblewrap and allow unprivileged user namespaces.' "$log"
            if grep -E 'SIGTRAP|signal arrived during cgo' "$log"; then exit 1; fi
            # Only relabel after verifying the expected startup error above.
            sed -i 's/^SCENARIO relaunch FAIL:/PROBE restricted bubblewrap EXPECTED:/' "$RUNNER_TEMP/gui-shots/bubblewrap-probe.log"
            echo 'PROBE restricted bubblewrap: clear startup error PASS' | tee -a "$RUNNER_TEMP/gui-shots/bubblewrap-probe.log"
          fi
          cat "$RUNNER_TEMP/gui-shots/bubblewrap-probe.log"
          # Ubuntu restricts unprivileged user namespaces, which WebKit's sandbox
          # needs; lift that for the fixture suite (CI only).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo unshare --net bash "$RUNNER_TEMP/gui-linux.sh" "$USER" "$RUNNER_TEMP" "$PATH"
      - name: Restore Windows firewall and theme
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-NetFirewallRule -DisplayName GUIAutotestFixture,GUIAutotestEngine -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' AppsUseLightTheme 1
      - name: Restore Mac theme
        if: always() && runner.os == 'macOS'
        run: defaults delete -g AppleInterfaceStyle 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gui-autotest-${{ runner.os }}
          path: ${{ runner.temp }}/gui-shots/
          retention-days: 7

  copy-window:
    # seestar-copy's app window on each OS's own webview. macOS and Linux need
    # cgo, so only these runners build it; scripts/copy/check-go.sh
    # cross-builds Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev bubblewrap xvfb xauth dbus-x11
          # Ubuntu restricts the unprivileged user namespaces WebKit's
          # sandbox needs; lift that for this job.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build and vet the window
        run: |
          ext=''; ldflags=''
          if [[ "$RUNNER_OS" == Windows ]]; then
            export CGO_ENABLED=0
            ext=.exe; ldflags='-H windowsgui'
          else
            export CGO_ENABLED=1
            if [[ "$RUNNER_OS" == macOS ]]; then
              export CC="$PWD/scripts/gui-mac-clang.sh" MACOSX_DEPLOYMENT_TARGET=13.0
            fi
          fi
          go vet -tags gui,production ./cmd/seestar-copy ./internal/copy/...
          go build -tags gui,production -ldflags="$ldflags" -o "$RUNNER_TEMP/seestar-copy$ext" ./cmd/seestar-copy
          echo "WINDOW_BIN=$RUNNER_TEMP/seestar-copy$ext" >> "$GITHUB_ENV"
          # The native check's build, with its test-only driver.
          go vet -tags gui,guitest,production ./cmd/seestar-copy
          bin="$RUNNER_TEMP/seestar-copy-guitest$ext"
          if [[ "$RUNNER_OS" == macOS ]]; then
            # A registered bundle, so that a Quit event can name it.
            bundle="$RUNNER_TEMP/Guitest.app"
            mkdir -p "$bundle/Contents/MacOS"
            bin="$bundle/Contents/MacOS/seestar-copy"
            cat > "$bundle/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>net.zml.seestar-copy.guitest</string>
            <key>CFBundleExecutable</key><string>seestar-copy</string>
            <key>CFBundleName</key><string>seestar-copy</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>0.0.0</string>
          </dict>
          </plist>
          PLIST
          fi
          go build -tags gui,guitest,production -ldflags="$ldflags" -o "$bin" ./cmd/seestar-copy
          if [[ "$RUNNER_OS" == macOS ]]; then
            plutil -lint "$bundle/Contents/Info.plist"
            /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$bundle"
          fi
          echo "GUITEST_BIN=$bin" >> "$GITHUB_ENV"
      - name: Open the window, load Browse and quit
        run: |
          cat > "$RUNNER_TEMP/window.py" <<'PY'
          import json, os, socket, subprocess, sys
          tmp = os.environ["RUNNER_TEMP"]
          # Browse dials the saved address once the page and its frame have
          # loaded, so a connection here shows the window works end to end.
          device = socket.create_server(("127.0.0.1", 0))
          device.settimeout(120)
          settings = os.path.join(tmp, "app.json")
          with open(settings, "w") as f:
              json.dump({"version": 1, "address": "127.0.0.1:%d" % device.getsockname()[1], "folder": os.path.join(tmp, "images"),
                         "start_copying": False}, f)
          log = open(os.path.join(tmp, "window.log"), "w")
          app = subprocess.Popen([os.environ["WINDOW_BIN"], "--settings", settings], stdout=log, stderr=log)
          try:
              device.accept()[0].close()
          except TimeoutError:
              app.kill()
              sys.exit("the window never loaded Browse")
          print("Browse loaded in the window")
          # Closing the window (WM_CLOSE on Windows) or SIGTERM quits the app.
          if os.name == "nt":
              subprocess.run(["taskkill", "/PID", str(app.pid)], check=True)
          else:
              app.terminate()
          code = app.wait(timeout=60)
          sys.exit("the app exited %d" % code if code else 0)
          PY
          python=$(command -v python3 || command -v python)
          if [[ "$RUNNER_OS" == Linux ]]; then
            GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' "$python" "$RUNNER_TEMP/window.py"
          else
            "$python" "$RUNNER_TEMP/window.py"
          fi
      - name: Hold a copy in the window, press the tab keys, then close it or quit
        run: |
          cat > "$RUNNER_TEMP/guitest.py" <<'PY'
          import json, os, subprocess, sys, time
          # The guitest build copies from its own fake telescope, whose
          # held file stalls mid-download; the address is never dialed.
          tmp, scenario = os.environ["RUNNER_TEMP"], sys.argv[1]
          folder = os.path.join(tmp, "images-" + scenario)
          def start(name, mode):
              settings = os.path.join(tmp, "guitest-%s.json" % name)
              with open(settings, "w") as f:
                  json.dump({"version": 1, "address": "127.0.0.1:1", "folder": folder, "start_copying": True}, f)
              path = os.path.join(tmp, "guitest-%s.log" % name)
              app = subprocess.Popen([os.environ["GUITEST_BIN"], "--settings", settings], stdout=open(path, "w"), stderr=subprocess.STDOUT,
                                     env=dict(os.environ, SEESTAR_COPY_GUITEST=mode, SEESTAR_COPY_GUITEST_FOLDER=folder))
              app.name, app.path = name, path
              return app
          def text(app):
              with open(app.path) as f:
                  return f.read()
          apps = []
          def fail(why):
              for app in apps:
                  if app.poll() is None:
                      app.kill()
                  print(text(app))
              sys.exit("%s: %s" % (scenario, why))
          def ready(app):
              deadline = time.monotonic() + 120
              while "guitest: ready" not in text(app):
                  if "guitest: FAIL" in text(app) or app.poll() is not None:
                      fail("%s: the page check failed" % app.name)
                  if time.monotonic() > deadline:
                      fail("%s: the page check didn't finish" % app.name)
                  time.sleep(0.2)
          def stop(app):
              if os.name == "nt":
                  # Closing the window: WM_CLOSE.
                  subprocess.run(["taskkill", "/PID", str(app.pid)], check=True)
              elif app.mode == "hold":
                  app.terminate()
              elif app.mode == "quit":
                  # The Quit menu item's event, through AppKit's own termination.
                  q = subprocess.run(["osascript", "-e", 'tell application id "net.zml.seestar-copy.guitest" to quit'],
                                     capture_output=True, text=True, timeout=30)
                  if q.returncode or "-128" in q.stdout + q.stderr:
                      fail("Quit was refused: %s%s" % (q.stdout, q.stderr))
          def exited(app):
              try:
                  code = app.wait(timeout=60)
              except subprocess.TimeoutExpired:
                  fail("%s: the app didn't exit" % app.name)
              out = text(app)
              print(out)
              if code or "guitest: FAIL" in out or "guitest: the app stopped before the window quit" not in out:
                  fail("%s: the app exited %d without a clean shutdown" % (app.name, code))
          # close and quit hold a transfer and stop during it; inuse runs a
          # second window on the folder of a first that holds one.
          modes = {"close": ["close"], "quit": ["quit"], "inuse": ["hold", "inuse"]}[scenario]
          for mode in modes:
              app = start(mode, mode)
              app.mode = mode
              apps.append(app)
              ready(app)
          for app in reversed(apps):
              stop(app)
              exited(app)
          PY
          python=$(command -v python3 || command -v python)
          case "$RUNNER_OS" in
            Linux)
              for s in close inuse; do
                GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' "$python" "$RUNNER_TEMP/guitest.py" "$s" || exit 1
              done ;;
            macOS) "$python" "$RUNNER_TEMP/guitest.py" close && "$python" "$RUNNER_TEMP/guitest.py" quit && "$python" "$RUNNER_TEMP/guitest.py" inuse ;;
            *) "$python" "$RUNNER_TEMP/guitest.py" close && "$python" "$RUNNER_TEMP/guitest.py" inuse ;;
          esac
      - name: App log
        if: failure()
        run: cat "$RUNNER_TEMP/window.log" || true
