[global]
server role = standalone server
security = user
map to guest = Bad User
guest account = nobody
server min protocol = SMB2_10
server max protocol = SMB3_11
smb ports = 1445
interfaces = lo
bind interfaces only = yes
disable netbios = yes
log file = /tmp/smb-e2e/samba.log
pid directory = /tmp/smb-e2e
[EMMC Images]
path = /tmp/smb-e2e/share
guest ok = yes
guest only = yes
read only = yes
follow symlinks = no
